[workspace]
resolver = "2"
members = ["crates/pixl-core", "crates/pixl-dsp", "crates/pixl-fx", "crates/pixl-gfx", "crates/pixl-gui", "crates/pixl-plugin"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
authors = ["PIXL Audio"]
license = "LicenseRef-PIXL-Proprietary"
publish = false

[workspace.dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
atomic_float = "1.1"
crossbeam-channel = "0.5"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-web-kit = "0.3.2"
block2 = "0.6.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
strip = "none"
panic = "unwind"

[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
